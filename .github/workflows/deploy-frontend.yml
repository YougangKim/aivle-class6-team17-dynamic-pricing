name: Deploy frontend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-frontend-deploy
  cancel-in-progress: false

jobs:
  # 1. 빌드 및 S3 업로드
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: "frontend"
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 기존에 사용하시던 AWS 인증 스텝이 있다면 여기에 추가
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with: ...

  # 2. EC2 SSM 배포 (Matrix 병렬 실행)
  deploy-ec2:
    needs: build-and-upload
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ec2-instance:
          - "i-0f223753033fc55b5"
          - "i-0f4a53981a9799c62"
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      # ⚠️ 핵심: 이 Job에서도 AWS Credentials 인증을 거쳐야 합니다!
      # (기존 워크플로우에서 사용하시던 OIDC Role 또는 Access Key 방식을 넣어주세요)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 예시 1) Access Key 방식 사용 시
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          # 예시 2) IAM Role(OIDC) 방식 사용 시
          # role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        shell: bash
        run: |
          ARTIFACT_NAME="build-${GITHUB_SHA}.tar.gz"

          # SSM 명령 전송
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${{ matrix.ec2-instance }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend ${GITHUB_SHA}" \
            --parameters "{\"commands\":[\"/usr/local/bin/deploy-aivle-web '${ARTIFACT_NAME}'\"]}" \
            --query "Command.CommandId" \
            --output text \
            --region "${AWS_REGION}" \
          )"

          echo "SSM Command ID: ${COMMAND_ID}"

          # 대기 수행
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ matrix.ec2-instance }}" \
            --region "${AWS_REGION}"

  # 3. CloudFront 캐시 무효화
  invalidate-cloudfront:
    needs: deploy-ec2
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
