name: Deploy frontend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-frontend-deploy
  cancel-in-progress: false

jobs:
  # 1. 프론트엔드를 한 번 빌드하고 S3에 업로드합니다.
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
    steps:
      - name: Checkout only frontend
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            frontend
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Verify frontend files
        shell: bash
        run: |
          test -f frontend/package.json
          test -f frontend/package-lock.json
          test -f frontend/vite.config.js

          echo "Frontend files:"
          find frontend -maxdepth 2 -type f | sort | head -100

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate frontend build
        shell: bash
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html

          echo "Build output:"
          find frontend/dist -maxdepth 2 -type f | sort

          echo "Build size:"
          du -sh frontend/dist

      - name: Package frontend dist only
        shell: bash
        run: |
          ARTIFACT_NAME="frontend-${GITHUB_SHA}.zip"

          cd frontend/dist
          zip -qr "${GITHUB_WORKSPACE}/${ARTIFACT_NAME}" .
          cd "${GITHUB_WORKSPACE}"

          test -s "${ARTIFACT_NAME}"

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "${GITHUB_ENV}"

          echo "Artifact:"
          ls -lh "${ARTIFACT_NAME}"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload versioned and latest frontend artifacts to S3
        shell: bash
        run: |
          aws s3 cp \
            "${ARTIFACT_NAME}" \
            "s3://${S3_BUCKET}/releases/${ARTIFACT_NAME}" \
            --region "${AWS_REGION}"

          aws s3 cp \
            "${ARTIFACT_NAME}" \
            "s3://${S3_BUCKET}/releases/frontend-latest.zip" \
            --region "${AWS_REGION}"

  # 2. ASG에서 현재 정상 상태인 EC2를 조회하고 SSM으로 한 번에 배포합니다.
  deploy-asg:
    needs: build-and-upload
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ASG_NAME: ${{ vars.ASG_NAME }}
    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find healthy EC2 instances in the Auto Scaling group
        id: instances
        shell: bash
        run: |
          INSTANCE_IDS_TEXT="$(
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${ASG_NAME}" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService' && HealthStatus=='Healthy'].InstanceId" \
              --output text \
              --region "${AWS_REGION}"
          )"

          if [[ -z "${INSTANCE_IDS_TEXT}" || "${INSTANCE_IDS_TEXT}" == "None" ]]; then
            echo "No Healthy/InService EC2 instances found in ASG: ${ASG_NAME}"
            exit 1
          fi

          echo "Target instances: ${INSTANCE_IDS_TEXT}"
          echo "instance_ids=${INSTANCE_IDS_TEXT}" >> "${GITHUB_OUTPUT}"

      - name: Deploy frontend to all current ASG instances through SSM
        shell: bash
        env:
          INSTANCE_IDS_TEXT: ${{ steps.instances.outputs.instance_ids }}
        run: |
          ARTIFACT_NAME="frontend-${GITHUB_SHA}.zip"
          read -r -a INSTANCE_IDS <<< "${INSTANCE_IDS_TEXT}"

          PARAMETERS="$(
            jq -n \
              --arg command "/usr/local/bin/deploy-aivle-web '${ARTIFACT_NAME}'" \
              '{commands: [$command]}'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${INSTANCE_IDS[@]}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy frontend ${GITHUB_SHA}" \
              --parameters "${PARAMETERS}" \
              --query "Command.CommandId" \
              --output text \
              --region "${AWS_REGION}"
          )"

          echo "SSM Command ID: ${COMMAND_ID}"

          for INSTANCE_ID in "${INSTANCE_IDS[@]}"; do
            STATUS="Pending"

            for attempt in $(seq 1 60); do
              STATUS="$(
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "Status" \
                  --output text \
                  --region "${AWS_REGION}" \
                  2>/dev/null || echo "Pending"
              )"

              echo "${INSTANCE_ID}: ${STATUS}"

              case "${STATUS}" in
                Success)
                  break
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  aws ssm get-command-invocation \
                    --command-id "${COMMAND_ID}" \
                    --instance-id "${INSTANCE_ID}" \
                    --region "${AWS_REGION}" || true
                  exit 1
                  ;;
              esac

              sleep 10
            done

            if [[ "${STATUS}" != "Success" ]]; then
              echo "Deployment did not complete in time on ${INSTANCE_ID}"
              exit 1
            fi
          done

  # 3. 모든 현재 ASG EC2의 배포가 성공한 후 CloudFront 캐시를 무효화합니다.
  invalidate-cloudfront:
    needs: deploy-asg
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
