name: Deploy frontend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-frontend-deploy
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------
  # 1. 빌드 및 S3 업로드 (1회 수행 - 중복 빌드 방지)
  # -----------------------------------------------------------------
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: "frontend"
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # AWS credentials 설정 및 S3 업로드 (필요시 추가)
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with: ...

  # -----------------------------------------------------------------
  # 2. EC2 SSM 배포 (Matrix 전략으로 여러 인스턴스에 병렬 배포)
  # -----------------------------------------------------------------
  deploy-ec2:
    needs: build-and-upload
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ec2-instance:
          - "i-0f223753033fc55b5"
          - "i-0f4a53981a9799c62"
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with: ...

      - name: Deploy via SSM and Wait
        shell: bash
        run: |
          ARTIFACT_NAME="build-${GITHUB_SHA}.tar.gz"
          
          # 1. SSM Command 전송
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${{ matrix.ec2-instance }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend ${GITHUB_SHA}" \
            --parameters "{\"commands\":[\"/usr/local/bin/deploy-aivle-web '${ARTIFACT_NAME}'\"]}" \
            --query "Command.CommandId" \
            --output text \
            --region "${AWS_REGION}" \
          )"

          echo "SSM Command ID: ${COMMAND_ID}"

          # 2. AWS Built-in Waiter 사용 (복잡한 bash 반복문 대체)
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ matrix.ec2-instance }}" \
            --region "${AWS_REGION}"

  # -----------------------------------------------------------------
  # 3. CloudFront 캐시 무효화 (모든 EC2 배포 완료 후 1회 수행)
  # -----------------------------------------------------------------
  invalidate-cloudfront:
    needs: deploy-ec2
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with: ...

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
